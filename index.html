<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="logo.png" type="image/png">
  <title>Student Record Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <div class="brand"><img src="logo.png" alt="University logo, 1908–2026"><div><small></small><h1>Student Record Management System</h1></div></div>
      <span id="dbStatus" class="badge">Connecting…</span>
    </div>
  </header>

  <main class="wrap">
    <div id="notice" class="notice" hidden></div>

    <section class="card" aria-labelledby="formTitle">
      <h2 id="formTitle">Add Student</h2>
      <form id="studentForm" novalidate>
        <div class="grid">
          <label>Student ID
            <input id="student_id" required placeholder="2024-0001">
          </label>
          <label>Full Name
            <input id="full_name" required placeholder="Juan Dela Cruz">
          </label>
          <label>Program
            <input id="program" required placeholder="BS Information Technology">
          </label>
          <label>Year Level
            <select id="year_level" required>
              <option value="">Select…</option>
              <option value="1">1st Year</option>
              <option value="2">2nd Year</option>
              <option value="3">3rd Year</option>
              <option value="4">4th Year</option>
              <option value="5">5th Year</option>
            </select>
          </label>
          <label class="span2">Email
            <input id="email" type="email" required placeholder="name@school.edu">
          </label>
        </div>
        <div class="actions">
          <button type="submit" id="saveBtn" class="btn primary">Save</button>
          <button type="button" id="cancelBtn" class="btn" hidden>Cancel Edit</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div class="listhead">
        <h2>Student Records <span id="count" class="count">0</span></h2>
        <input id="search" type="search" placeholder="Search records…" aria-label="Search records">
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr><th>Student ID</th><th>Full Name</th><th>Program</th><th>Year</th><th>Email</th><th>Actions</th></tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden>No student records yet. Add one above.</p>
    </section>
  </main>

  

  <div id="modal" class="modal" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="mTitle">
      <h3 id="mTitle">Delete record?</h3>
      <p id="mText"></p>
      <div class="actions">
        <button id="mCancel" class="btn">Cancel</button>
        <button id="mOk" class="btn danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
